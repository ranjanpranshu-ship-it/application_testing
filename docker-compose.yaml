services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: application-testing-api
    image: pran4450/application-testing-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: node dist/main.js
